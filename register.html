<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - iCITY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        .auth-box {
            background: white;
            border-radius: 1.5rem;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            color: #1d1d1f;
        }
        .auth-subtitle {
            text-align: center;
            color: #86868b;
            margin-bottom: 2rem;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-weight: 600;
            color: #1d1d1f;
            font-size: 0.875rem;
        }
        .form-group input {
            padding: 1rem;
            border: 2px solid #e1e1e6;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .auth-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
            margin-top: 1rem;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
        }
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #86868b;
        }
        .auth-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-error {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }
        .auth-success {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-box">
            <h1 class="auth-title">Регистрация</h1>
            <p class="auth-subtitle">Создайте аккаунт для покупок</p>
            
            <div class="auth-error" id="errorBox"></div>
            <div class="auth-success" id="successBox"></div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>Имя пользователя *</label>
                    <input type="text" name="username" required placeholder="Ваше имя">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" name="phone" placeholder="+7 (999) 000-00-00">
                </div>
                <div class="form-group">
                    <label>Пароль *</label>
                    <input type="password" name="password" required placeholder="Минимум 6 символов" minlength="6">
                </div>
                <button type="submit" class="auth-btn" id="submitBtn">Зарегистрироваться</button>
            </form>
            
            <p class="auth-link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </div>
    
    <script>
      document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    
    btn.disabled = true;
    btn.textContent = 'Регистрация...';
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    
    const formData = new FormData(this);
    
    try {
        console.log('Отправка данных на api/auth.php?action=register');
        
        const response = await fetch('api/auth.php?action=register', {
            method: 'POST',
            body: formData
        });
        
        console.log('Статус ответа:', response.status);
        
        const text = await response.text();
        console.log('Ответ сервера:', text);
        
        const result = JSON.parse(text);
        
        if (result.success) {
            successBox.textContent = 'Регистрация успешна! Перенаправление...';
            successBox.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'cabinet.html';
            }, 1500);
        } else {
            errorBox.textContent = result.error || 'Неизвестная ошибка';
            errorBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Зарегистрироваться';
        }
    } catch (error) {
        console.error('Ошибка:', error);
        errorBox.textContent = 'Ошибка: ' + error.message + '. Откройте консоль (F12) для деталей.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Зарегистрироваться';
    }
});
    </script>
</body>
</html>
